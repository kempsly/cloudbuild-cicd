steps:
  # 1. Run unit tests
  - name: 'python:3.10'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'pip install -r requirements.txt && python -m pytest -v'

  # 2. Build Docker image for Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - 'us-docker.pkg.dev/$PROJECT_ID/mlops-docker/demo-flask-app:$BUILD_ID'
      - '.'

  # 3. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-docker.pkg.dev/$PROJECT_ID/mlops-docker/demo-flask-app:$BUILD_ID'

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:stable'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'demo-flask-app'
      - '--image=us-docker.pkg.dev/$PROJECT_ID/mlops-docker/demo-flask-app:$BUILD_ID'
      - '--region=us-central1'
      - '--project=$PROJECT_ID'
      - '--allow-unauthenticated'

images:
  - 'us-docker.pkg.dev/$PROJECT_ID/mlops-docker/demo-flask-app:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
